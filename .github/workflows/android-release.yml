name: Signed Android release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          SNAPSORT_KEYSTORE_BASE64: ${{ secrets.SNAPSORT_KEYSTORE_BASE64 }}
          SNAPSORT_KEYSTORE_PASSWORD: ${{ secrets.SNAPSORT_KEYSTORE_PASSWORD }}
          SNAPSORT_KEY_ALIAS: ${{ secrets.SNAPSORT_KEY_ALIAS }}
          SNAPSORT_KEY_PASSWORD: ${{ secrets.SNAPSORT_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('SNAPSORT_KEYSTORE_BASE64', 'SNAPSORT_KEYSTORE_PASSWORD', 'SNAPSORT_KEY_ALIAS', 'SNAPSORT_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required signing secret: {name}; no release will be published.')
          key = Path(os.environ['RUNNER_TEMP']) / 'snapsort-release.jks'
          key.write_bytes(base64.b64decode(os.environ['SNAPSORT_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
      - name: Validate and build signed release
        env:
          SNAPSORT_KEYSTORE_FILE: ${{ runner.temp }}/snapsort-release.jks
          SNAPSORT_KEYSTORE_PASSWORD: ${{ secrets.SNAPSORT_KEYSTORE_PASSWORD }}
          SNAPSORT_KEY_ALIAS: ${{ secrets.SNAPSORT_KEY_ALIAS }}
          SNAPSORT_KEY_PASSWORD: ${{ secrets.SNAPSORT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          export SNAPSORT_APK_VERSION="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk)"
          python3 - <<'PY'
          import os, re
          version = re.search(r"versionName='([^']+)'", os.environ['SNAPSORT_APK_VERSION']).group(1)
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag must exactly match the APK versionName; no release will be published.')
          PY
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/SnapSort-${GITHUB_REF_NAME}.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk release-assets/SHA256SUMS --verify-tag --title "SnapSort $GITHUB_REF_NAME" --generate-notes
      - name: Upload signed build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: |
            release-assets/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/snapsort-release.jks"
